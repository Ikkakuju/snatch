name: CI
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The website only. Runs on the repo's own runner on the omarchy host
  # (`omarchy-snatch-ci`, registered with Ikkakuju/infra's provision-ci-runner.sh).
  # The Mac app is checked by macos.yml, which needs a macOS runner.
  check:
    runs-on: [self-hosted, ci, omarchy]
    # 这个 job 会抢全局 ci-serial 锁：卡死的话所有仓库的 CI 都排在它后面，
    # 所以给个上界，别指望 GitHub 默认的 6 小时。
    timeout-minutes: 20
    steps:
      # Pinned to full SHAs; Dependabot/Renovate should move them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun version matches package.json
        run: grep -q "bun@$(cat .bun-version)" package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run build

